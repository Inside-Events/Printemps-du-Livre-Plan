<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Plan · Printemps du Livre de Montaigu 2026</title>
<style>
    /* Styles de base conservés pour l'identité visuelle */
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{background:#FFE000;font-family:Arial,sans-serif;color:#111;overflow-x:hidden;height:100%;}
    body{padding:0 0 1rem;}

    .hero{padding:1rem 1.25rem 0.75rem;}
    .hero-title{font-family:'Arial Black',Arial,sans-serif;font-size:22px;font-weight:900;line-height:1;letter-spacing:-0.5px;}
    .hero-title span{color:#D4006A;}
    .hero-sub{font-size:11px;color:#555;margin-top:4px;}

    /* Conteneur du plan */
    .map-container {
        position: relative;
        margin: 0 0.75rem;
        border: 2px solid #111;
        background: #fff;
        line-height: 0; /* Évite les espaces sous l'image */
    }
    .map-image {
        width: 100%;
        height: auto;
        display: block;
    }

    /* Zones cliquables invisibles */
    .click-zone {
        position: absolute;
        cursor: pointer;
        /* background: rgba(255,0,0,0.2); // Décommente pour voir les zones lors du réglage */
    }

    /* Styles des modales existants */
    .modal-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);z-index:1000;display:none;align-items:flex-end;justify-content:center;}
    .modal-backdrop.open{display:flex;}
    .modal{background:#fff;width:100%;max-width:560px;border-top-left-radius:16px;border-top-right-radius:16px;padding:1.25rem;max-height:80vh;overflow-y:auto;}
    .modal-cat{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;margin-bottom:4px;}
    .modal-title{font-family:'Arial Black',Arial,sans-serif;font-size:20px;font-weight:900;margin-bottom:8px;}
    .modal-desc{font-size:13px;color:#444;line-height:1.5;margin-bottom:14px;}
    .btn-close{background:#111;color:#FFE000;font-family:'Arial Black';padding:12px;width:100%;border:none;cursor:pointer;}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-title">Plan du <span>festival</span> 📖</div>
  <div class="hero-sub">Printemps du Livre de Montaigu · 8 → 10 mai 2026</div>
</div>

<div class="map-container">
    <img src="plan-felt.png" alt="Plan du festival" class="map-image">

    <!-- Zones de clics positionnées en % par rapport à l'image -->
    <!-- Généraliste -->
    <div class="click-zone" style="top:25%; left:45%; width:15%; height:30%;" onclick="showZone('generaliste')"></div>
    <!-- BD -->
    <div class="click-zone" style="top:50%; left:32%; width:10%; height:12%;" onclick="showZone('bd')"></div>
    <!-- Jeunesse -->
    <div class="click-zone" style="top:55%; left:40%; width:12%; height:15%;" onclick="showZone('jeunesse')"></div>
    <!-- Entrée (Arc rouge) -->
    <div class="click-zone" style="top:5%; left:75%; width:15%; height:15%;" onclick="showZone('entree')"></div>
    <!-- Bar/Rotonde -->
    <div class="click-zone" style="top:70%; left:33%; width:8%; height:8%;" onclick="showZone('bar')"></div>
</div>

<!-- Structure de la modale conservée[cite: 1] -->
<div class="modal-backdrop" id="modal" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-cat" id="modalCat"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-desc" id="modalDesc"></div>
    <div id="modalStats"></div>
    <button class="btn-close" onclick="closeModal()">FERMER</button>
  </div>
</div>

<script>
// Données extraites de ton fichier initial[cite: 1]
const ZONE_INFO = {
  'generaliste': { cat:'Pôle Littérature', title:'📚 Espace Généraliste', desc:"Le cœur du festival ! 5 kiosques libraires et 17 stands éditeurs. Romans, polars, témoignages, essais." },
  'bd': { cat:'Pôle Littérature', title:'🎨 Espace BD', desc:"Bande dessinée et roman graphique. 33 auteurs et un espace Dessin en Live." },
  'jeunesse': { cat:'Pôle Littérature', title:'🧒 Espace Jeunesse', desc:"Espace dédié aux enfants et adolescents. Kiosques H, I et J avec coin lecture aménagé." },
  'entree': { cat:'Accès', title:'🚪 Entrée Printemps', desc:"L'entrée principale du festival. Récupérez votre programme à l'Espace Accueil juste à côté." },
  'bar': { cat:'Restauration', title:'🍹 Bar · Rotonde', desc:"Espace convivial pour souffler entre deux rencontres. Tabourets hauts et ambiance détendue." }
};

function showZone(id) {
  const z = ZONE_INFO[id];
  document.getElementById('modalCat').textContent = z.cat;
  document.getElementById('modalTitle').textContent = z.title;
  document.getElementById('modalDesc').textContent = z.desc;
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
</script>

</body>
</html>
